<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Tales of Elements</title>
<style>
:root{
  --bg:#12101c; --panel:#1d1a2c; --panel2:#262238; --line:#3a3452; --text:#f2eefc; --dim:#a39cba;
  --fire:#ff7a2f; --water:#38c6ff; --bolt:#c77dff; --omni:#ffe27a; --hp:#5be37d; --bad:#ff4d6d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#2a2145 0%,#12101c 60%)}
#app{position:relative;width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;overflow:hidden}
#stage{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;min-height:0;padding:4px 8px 8px}
#stage.shake{animation:shake var(--sd,.3s) linear}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(calc(var(--si)*-1px),calc(var(--si)*.6px))}30%{transform:translate(calc(var(--si)*1px),calc(var(--si)*-.8px))}45%{transform:translate(calc(var(--si)*-.7px),calc(var(--si)*.4px))}60%{transform:translate(calc(var(--si)*.6px),calc(var(--si)*.6px))}80%{transform:translate(calc(var(--si)*-.3px),calc(var(--si)*-.2px))}}

#top{display:flex;align-items:center;gap:8px;height:32px;flex:none;position:relative;z-index:12}
#roundLbl{font-weight:800;font-size:17px;letter-spacing:.5px}
#phaseLbl{font-size:11px;color:var(--dim);padding:2px 7px;border-radius:8px;border:1px solid var(--line)}
#phaseLbl.exec{color:#fff;border-color:#ff7a2f;background:#ff7a2f33}
#top .sp{flex:1}
.ib{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}

/* enemies */
#enemies{flex:1;min-height:128px;display:flex;align-items:flex-end;justify-content:space-around;gap:4px;position:relative}
.en{position:relative;flex:1;max-width:130px;display:flex;flex-direction:column;align-items:center;transition:transform .25s,opacity .5s,filter .5s;cursor:pointer}
.en .art{width:130%;margin:0 -15%;aspect-ratio:1;max-height:min(130px,16.5vh);background:center bottom/contain no-repeat;filter:drop-shadow(0 6px 6px #0008);position:relative;z-index:1}
.en.boss .art{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045) translateY(-3px)}}
.en.lunge{animation:elunge .45s}
@keyframes elunge{0%,100%{transform:none}35%{transform:translateY(16px) scale(1.08)}}
.en.hurt .art{animation:hurt .3s}
@keyframes hurt{0%,100%{}30%{filter:brightness(2.4) drop-shadow(0 0 8px #fff)}60%{transform:translateX(4px)}}
.en.pushed{animation:pushed .6s}
@keyframes pushed{0%,100%{transform:none}30%{transform:translateY(-14px) scale(.92)}}
.en.dead{opacity:.18;filter:grayscale(1);pointer-events:none}
.en.tgt .art{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 6px 6px #0008)}
.en .ring{position:absolute;top:8%;left:50%;width:74%;aspect-ratio:1;transform:translateX(-50%);border:2px dashed #ffffffaa;border-radius:50%;opacity:0;pointer-events:none;transition:opacity .2s}
.en.tgt .ring{opacity:1;animation:spin 6s linear infinite}
.nm{font-size:10.5px;color:var(--dim);margin-top:1px;white-space:nowrap}
.bar{position:relative;width:92%;height:9px;background:#0007;border-radius:5px;overflow:hidden;border:1px solid #fff2}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--hp);transition:width .35s;border-radius:4px}
.bar b{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffffffaa 0 3px,#ffffff44 3px 6px);transition:width .35s}
.bar s{position:absolute;top:0;bottom:0;background:#7fc8ff;transition:width .35s,left .35s}
.en .bar i{background:#ff5a7a}
.hpt{font-size:10px;color:var(--dim);margin-top:1px;white-space:nowrap}
.hpt em{font-style:normal;color:#ffb3c0}
.aura{position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:#000a;border:2px solid #fff3;opacity:0;transform:scale(.4);transition:transform .25s,opacity .25s}
.aura.on{opacity:1;transform:scale(1);animation:auraPulse 1.6s infinite}
@keyframes auraPulse{0%,100%{box-shadow:0 0 6px var(--ac)}50%{box-shadow:0 0 16px var(--ac)}}
.shld{position:absolute;top:2px;right:2px;font-size:10px;font-weight:800;padding:2px 5px;border-radius:8px;background:#1d3a5a;border:1px solid #7fc8ff;display:none}
.shld.on{display:block}
.st{position:absolute;top:32px;left:2px;font-size:13px}
.en .aura,.en .shld,.en .st{z-index:3}
.rp{position:absolute;top:36%;left:50%;transform:translate(-50%,-50%);font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:9px;white-space:nowrap;pointer-events:none;display:none;z-index:3;background:linear-gradient(90deg,var(--c1),var(--c2));border:1px solid #fff;color:#fff;text-shadow:0 1px 2px #000;animation:rpb .9s infinite}
.rp.on{display:block}
@keyframes rpb{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.08)}}
.tag{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:13px;white-space:nowrap;pointer-events:none;text-shadow:0 2px 3px #000;animation:tagUp 1.2s forwards;z-index:4}
@keyframes tagUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-110%)}}
@keyframes spin{to{transform:translateX(-50%) rotate(360deg)}}

/* board */
#board{flex:none;position:relative;background:#0b0914;border:1px solid var(--line);border-radius:12px;padding:3px 4px 2px 3px;margin-top:4px}
.lane{position:relative;height:22px;display:flex;align-items:center}
.lane.dead{opacity:.25}
.lb{width:22px;height:20px;flex:none;border-radius:50%;background:#000 center/cover;border:1.5px solid #ff5a7a}
.tr{position:relative;flex:1;height:100%;margin-left:5px;border-bottom:1px solid #ffffff0a}
.tr.hero{cursor:pointer}
.zone{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,#ffffff06 0 6px,#0000 6px 12px);border-left:2px solid #ffe27a88;pointer-events:none}
.mk{position:absolute;top:2px;transform:translateX(-50%);height:18px;padding:0 5px;border-radius:9px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:1px;background:#4a1a2a;border:1px solid #ff5a7a;white-space:nowrap;z-index:2;transition:opacity .3s}
.mk.big{background:#7a1414;border-color:#ff3b3b;box-shadow:0 0 8px #ff3b3b88}
.mk.soft{background:#24213a;border-color:#6b6590;color:#cfc8e8}
.mk.cancel{opacity:.55;text-decoration:line-through;border-color:#38c6ff}
.mk.next{opacity:.5}
.mk.from{opacity:.35;border-style:dashed;z-index:1}
.mk.go{animation:mkgo .5s}
@keyframes mkgo{50%{transform:translateX(-50%) scale(1.35);filter:brightness(1.8)}}
.arw{position:absolute;top:10px;height:2px;background:linear-gradient(90deg,#ffb36b11,#ffb36b);z-index:1;pointer-events:none}
.arw::after{content:'';position:absolute;right:-1px;top:-3px;border:4px solid transparent;border-left:6px solid #ffb36b}
.ch{position:absolute;top:3px;height:16px;border-radius:5px;background:color-mix(in srgb,var(--ec) 28%,#0b0914);border:1px solid var(--ec);z-index:2;font-size:9px;line-height:14px;padding-left:3px;color:#fff;white-space:nowrap;overflow:visible}
.ch span.nmc{display:block;overflow:hidden;text-overflow:ellipsis;margin-right:12px}
.ch .ic{position:absolute;right:-9px;top:-2px;width:18px;height:18px;border-radius:50%;background:var(--ec);font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 6px var(--ec)}
.ch.ghost{opacity:.55;border-style:dashed;animation:ghostP 1s infinite}
@keyframes ghostP{0%,100%{opacity:.4}50%{opacity:.7}}
.ch.done{filter:grayscale(.6) brightness(.7)}
.ch.go .ic{animation:icgo .45s}
@keyframes icgo{50%{transform:scale(1.7)}}
.ch.cancel{opacity:.4;text-decoration:line-through}
.rx{position:absolute;right:-6px;top:-12px;font-size:8.5px;background:#ffe27a;color:#1a1200;border-radius:5px;padding:0 3px;font-weight:900;white-space:nowrap;z-index:3;line-height:12px}
.kx{position:absolute;right:-16px;top:-12px;font-size:10px;z-index:3}
.lane.erow{height:32px}
.lb.ei{background:#2a1420;display:flex;align-items:center;justify-content:center;font-size:11px}
.gl{position:absolute;top:0;bottom:0;width:1px;background:#ffffff16;pointer-events:none}
.mk.e{top:2px;width:22px;height:22px;padding:0;border-radius:50%;background:#000 center/cover;border:2px solid #ff5a7a;display:block}
.mk.e .bd{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:8.5px;font-weight:800;background:#000d;border-radius:4px;padding:0 2px;white-space:nowrap;line-height:11px}
.mk.e.big{border-color:#ff3b3b;box-shadow:0 0 8px #ff3b3b}
.mk.e.soft{border-color:#6b6590}
.mk.e.cancel{opacity:.6;text-decoration:none;border-color:#38c6ff}
.mk.e.cancel .bd{text-decoration:line-through}
.en.boss{max-width:300px}
.en.boss .art{width:125%;margin:0 -12.5%;max-height:min(220px,27vh)}
.nm .em{font-weight:900;margin-left:3px;padding:0 3px;border-radius:5px;font-size:9.5px}
.nm .em.up{background:#ffb347;color:#2a1600}.nm .em.dn{background:#4a4560;color:#cfc8e8}
.hst{position:absolute;left:4px;top:-8px;display:flex;gap:2px;z-index:4;pointer-events:none}
.hst span{font-size:9px;font-weight:800;background:#0b0914;border:1px solid #ffffff33;border-radius:6px;padding:0 3px;line-height:13px;white-space:nowrap}
.hst span.good{border-color:#7dffb0}.hst span.bad{border-color:#ff8fa3}
.hc .bar s{position:absolute;top:0;bottom:0;background:#7fc8ff}
#waveLbl{font-size:11px;font-weight:800;padding:2px 7px;border-radius:8px;background:#ffffff12;border:1px solid var(--line)}
#waveLbl.boss{background:#ff3b3b33;border-color:#ff3b3b;color:#ffb3b3}
#cut{position:absolute;inset:0;z-index:24;pointer-events:none}
/* метка стихии врага на герое */
.hmark{position:absolute;right:-6px;top:-8px;z-index:5;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:#000c;border:2px solid var(--mc);box-shadow:0 0 8px var(--mc);animation:auraPulse 1.6s infinite;--ac:var(--mc);pointer-events:none}
/* выбор сложности */
.dfRow{display:flex;gap:6px;margin-top:10px}
.dfRow button{flex:1;padding:8px 4px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:12px;font-weight:800}
.dfRow button.on{color:#fff;border-color:var(--dc);background:color-mix(in srgb,var(--dc) 25%,var(--panel));box-shadow:0 0 10px -2px var(--dc)}
.dfRow button small{display:block;font-size:9px;font-weight:600;opacity:.8;margin-top:1px}
#diffLbl{font-size:10px;color:var(--dim)}
/* отклик на тап */
button,.pk,.hc,.en,.die,.ch{-webkit-tap-highlight-color:transparent}
button:active:not(:disabled),.pk:active,.die:active{transform:scale(.93)!important;transition:transform .06s!important}
.hc:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ffffff66 0%,#ffffff22 40%,transparent 70%);transform:translate(-50%,-50%) scale(0);animation:rip .45s ease-out forwards;z-index:30}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
/* живые юниты */
.en .art{animation:idleE 3.4s ease-in-out infinite}
.en:nth-child(2) .art{animation-delay:-1.1s}.en:nth-child(3) .art{animation-delay:-2.2s}
@keyframes idleE{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.015)}}
.hc .art{animation:idleH 2.8s ease-in-out infinite}
@keyframes idleH{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.hc.lowhp{box-shadow:inset 0 0 0 1px #ff4d6d,0 0 12px -3px #ff4d6d;animation:lowP 1.1s infinite}
@keyframes lowP{50%{box-shadow:inset 0 0 0 1px #ff4d6d,0 0 18px 0 #ff4d6d}}
/* переход этапов */
#stageFx{position:absolute;left:0;right:0;top:46%;z-index:22;pointer-events:none;display:flex;justify-content:center;opacity:0}
#stageFx.go{animation:stg .75s ease-out forwards}
#stageFx b{font-size:20px;font-weight:900;font-style:italic;letter-spacing:3px;color:#fff;padding:3px 26px;background:linear-gradient(90deg,transparent,#ffffff22 20%,#ffffff33 50%,#ffffff22 80%,transparent);text-shadow:0 2px 0 #000,0 0 10px #c77dff}
@keyframes stg{0%{opacity:0;transform:translateX(-60px) skewX(-15deg)}25%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0;transform:translateX(60px) skewX(15deg)}}
.tr .colhl{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,transparent,#ffffff1c,transparent);pointer-events:none;animation:colhl .6s forwards}
@keyframes colhl{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#edge{position:absolute;inset:0;z-index:18;pointer-events:none;opacity:0;box-shadow:inset 0 0 60px 10px #ff2a3a}
#stage.punch{animation:punch .22s ease-out}
@keyframes punch{0%{transform:scale(1)}35%{transform:scale(1.025)}100%{transform:scale(1)}}
#motes{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#motes i{position:absolute;width:2px;height:2px;border-radius:50%;background:#c9b8ff;opacity:.0;animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.5}85%{opacity:.35}100%{transform:translate(var(--dx),-140px);opacity:0}}
#bGo.ready{animation:goP 1.4s infinite}
@keyframes goP{0%,100%{box-shadow:0 0 0 0 #ff7a2f88}50%{box-shadow:0 0 0 6px #ff7a2f00}}
.rwT{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);z-index:23;pointer-events:none;font-weight:900;font-size:13px;color:#1a1200;background:linear-gradient(90deg,#ffe14d,#ffb347);border:2px solid #fff;border-radius:12px;padding:4px 12px;white-space:nowrap;box-shadow:0 0 18px #ffe14d88;animation:rwA 1.5s forwards}
@keyframes rwA{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
#bossFx{position:absolute;inset:0;z-index:0;pointer-events:none;display:none;overflow:hidden}
#app.boss #bossFx{display:block}
#bossFx .vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 45% at 50% 24%,color-mix(in srgb,var(--bc) 32%,transparent) 0%,transparent 70%),radial-gradient(ellipse at 50% 45%,transparent 50%,#2a0006dd 100%);animation:bossPulse 2.4s ease-in-out infinite}
#app.rage #bossFx .vig{animation-duration:1s;background:radial-gradient(ellipse 75% 50% at 50% 24%,#ff1a1a55 0%,transparent 70%),radial-gradient(ellipse at 50% 45%,transparent 42%,#4a0008ee 100%)}
@keyframes bossPulse{0%,100%{opacity:.6}50%{opacity:1}}
#bossFx .rays{position:absolute;left:50%;top:24%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(color-mix(in srgb,var(--bc) 14%,transparent) 0 6deg,transparent 6deg 18deg);border-radius:50%;mask:radial-gradient(circle,#000 0%,transparent 55%);-webkit-mask:radial-gradient(circle,#000 0%,transparent 55%);animation:raysR 40s linear infinite}
@keyframes raysR{to{transform:rotate(360deg)}}
#bossFx i{position:absolute;bottom:-12px;width:4px;height:4px;border-radius:50%;background:var(--bc);box-shadow:0 0 8px var(--bc),0 0 2px #fff;animation:ember linear infinite;opacity:0}
@keyframes ember{0%{transform:translate(0,0) scale(1);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-105vh) scale(.4);opacity:0}}
.en.boss::before{content:'';position:absolute;left:50%;top:42%;width:150%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--bc) 70%,transparent) 0%,transparent 62%);animation:bossAura 2.4s ease-in-out infinite;z-index:0;pointer-events:none}
#app.rage .en.boss::before{background:radial-gradient(circle,#ff2a2acc 0%,transparent 62%);animation-duration:1s}
@keyframes bossAura{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.92)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.06)}}
.en.boss.enter .art{animation:bossIn 1.2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes bossIn{0%{transform:scale(2.2) translateY(30px);filter:brightness(0) drop-shadow(0 0 20px #f00);opacity:0}40%{opacity:1;filter:brightness(0) drop-shadow(0 0 30px #f00)}100%{transform:none;filter:drop-shadow(0 6px 6px #0008)}}
.rageLbl{position:absolute;top:22%;right:2%;z-index:6;font-size:10px;font-weight:900;color:#fff;background:#b3121f;border:1px solid #ff6b6b;border-radius:7px;padding:1px 6px;animation:thrP .8s infinite;pointer-events:none}
.hc.stunned{border-color:#ffe14d;box-shadow:0 0 0 1px #ffe14d,0 0 14px -2px #ffe14d;animation:stunB 1s infinite}
.hc.willstun{border-color:#ff9f43;border-style:dashed}
@keyframes stunB{0%,100%{box-shadow:0 0 0 1px #ffe14d,0 0 6px -2px #ffe14d}50%{box-shadow:0 0 0 1px #ffe14d,0 0 18px 0 #ffe14d}}
.stunLbl{position:absolute;left:3px;bottom:3px;z-index:4;font-size:9px;font-weight:900;color:#1a1200;background:#ffe14d;border:1px solid #000;border-radius:6px;padding:1px 4px;white-space:nowrap;pointer-events:none}
.stunLbl.will{background:#ff9f43}
.hc.stunned .art{animation:dizzy 1.2s ease-in-out infinite}
@keyframes dizzy{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.hc .stars{position:absolute;left:14px;top:2px;font-size:13px;z-index:4;pointer-events:none;animation:starsR 1.6s linear infinite}
@keyframes starsR{0%{transform:translateX(0) scale(1)}25%{transform:translateX(14px) scale(.8)}50%{transform:translateX(28px) scale(1)}75%{transform:translateX(14px) scale(1.2)}100%{transform:translateX(0) scale(1)}}
.ch.stunned{opacity:1!important;border:2px dashed #ffe14d!important;background:repeating-linear-gradient(135deg,#ffe14d33 0 5px,#0b0914 5px 10px)!important;text-decoration:line-through}
.ch .sx{position:absolute;left:-2px;top:-13px;font-size:8.5px;font-weight:900;background:#ffe14d;color:#1a1200;border-radius:5px;padding:0 3px;line-height:12px;white-space:nowrap;z-index:3;text-decoration:none}
.itn{font-size:9.5px;color:#cfc8e8;margin-top:1px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.itn b{color:#fff}
.thr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:5;font-size:9.5px;font-weight:900;white-space:nowrap;padding:1px 6px;border-radius:8px;background:#2a1420;border:1px solid #ff5a7a99;color:#ffb3c0;pointer-events:none;display:none}
.thr.on{display:block}
.thr.hot{background:#b3121f;border-color:#ff3b3b;color:#fff;animation:thrP .8s infinite}
.thr.ok{background:#123a26;border-color:#7dffb0;color:#b9ffd6;animation:none}
@keyframes thrP{0%,100%{box-shadow:0 0 4px #ff3b3b;transform:translateX(-50%) scale(1)}50%{box-shadow:0 0 14px #ff3b3b;transform:translateX(-50%) scale(1.06)}}
.en.hot .art{animation:hotA 1s infinite}
@keyframes hotA{0%,100%{filter:drop-shadow(0 0 2px #ff3b3b) drop-shadow(0 6px 6px #0008)}50%{filter:drop-shadow(0 0 12px #ff3b3b) drop-shadow(0 6px 6px #0008)}}
.en.acting::before{content:'ХОД';position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);z-index:6;font-size:11px;font-weight:900;letter-spacing:1px;color:#fff;background:#ff3b3b;border:2px solid #fff;border-radius:7px;padding:1px 6px;animation:actA .7s forwards;pointer-events:none}
@keyframes actA{0%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}20%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
#ph{position:absolute;top:2px;bottom:12px;width:2px;background:#fff;box-shadow:0 0 8px #fff;z-index:5;display:none;transition:left .28s linear;pointer-events:none}
.axis{display:flex;font-size:8.5px;color:var(--dim);height:11px;margin-left:27px;position:relative}
.axis span{position:absolute}
.tfree{position:absolute;top:5px;height:12px;border-radius:4px;border:1px dashed #ffffff22;pointer-events:none}

/* mid */
#mid{flex:none;height:30px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--dim);padding:0 6px;line-height:1.2}
#mid b{color:var(--text)}

/* allies */
#allies{flex:none;display:flex;gap:6px;height:88px}
.hc{position:relative;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;display:flex;gap:5px;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;min-width:0}
.hc .art{width:66px;flex:none;margin:-28px -10px 0 -12px;background:center bottom/contain no-repeat;position:relative;z-index:3;pointer-events:none;filter:drop-shadow(0 4px 4px #0009)}
.hc .inf{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.hc.sel{border-color:var(--ec);box-shadow:0 0 0 1px var(--ec),0 0 16px -2px var(--ec)}
.hc.casting{animation:cast .45s}
@keyframes cast{40%{transform:translateY(-10px) scale(1.04)}}
.hc.hit{animation:hhit .35s}
@keyframes hhit{25%{transform:translateX(-6px);background:#4a1525}60%{transform:translateX(5px)}}
.hc.dead{filter:grayscale(1);opacity:.35}
.hn{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc .bar{width:100%}
.hc .row{display:flex;justify-content:space-between;gap:3px;font-size:10px;color:var(--dim);white-space:nowrap}
.hc .pips i{width:7px;height:7px}
.pips{display:flex;gap:3px;align-items:center}
.pips i{width:8px;height:8px;border-radius:50%;border:1px solid #fff5;background:#0006}
.pips i.on{background:var(--ec);border-color:var(--ec);box-shadow:0 0 5px var(--ec)}
.tbar{height:4px;background:#ffffff14;border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ec);opacity:.8}
.hc.bench{flex:.62;flex-direction:column;align-items:center;gap:0;background:var(--panel2);padding:4px}
.hc.bench .art{width:118%;flex:1;opacity:.85;margin:-22px -9% 0;filter:drop-shadow(0 4px 4px #0009)}
.benchLbl{font-size:9px;color:var(--dim);text-transform:uppercase}
.swapBtn{font-size:10px;font-weight:700;border-radius:7px;padding:2px 4px;border:1px solid var(--line);background:#0004;color:var(--dim);width:100%;font-family:inherit}
.swapBtn.ok{color:#fff;background:#2f6f6a;border-color:#4fd1c5}

/* dice */
#diceRow{flex:none;display:flex;align-items:center;gap:6px;height:44px;margin-top:5px}
#diceRow .lbl{font-size:10px;color:var(--dim);width:36px;line-height:1.1}
#dice{flex:1;display:flex;gap:5px}
.die{position:relative;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;background:linear-gradient(160deg,color-mix(in srgb,var(--dc) 55%,#000),color-mix(in srgb,var(--dc) 25%,#000));border:2px solid var(--dc);box-shadow:inset 0 2px 0 #fff3;transition:transform .2s,opacity .3s}
.die.omni{background:linear-gradient(160deg,#6b5a1a,#2a2208)}
.die.will{transform:translateY(-6px);box-shadow:0 0 10px var(--dc),inset 0 2px 0 #fff3}
.die.res{opacity:.32}
.die .who{position:absolute;bottom:-4px;right:-4px;font-size:9px;background:#000;border-radius:5px;padding:0 2px}
.die.half::after{content:'½';position:absolute;top:-5px;right:-4px;font-size:9px;font-weight:900;background:#000;border-radius:5px;padding:0 3px;color:#fff}
.die.roll{animation:roll .55s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes roll{0%{transform:translateY(-40px) rotate(-260deg) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.die.burn{animation:burn .55s forwards}
@keyframes burn{40%{filter:brightness(2) sepia(1) saturate(4) hue-rotate(-20deg);transform:scale(1.1)}100%{opacity:0;transform:translateY(-18px) scale(.4);filter:blur(3px)}}
.die.spent{animation:spent .45s forwards}
@keyframes spent{100%{opacity:0;transform:translateY(-34px) scale(.5)}}
#diceInfo{font-size:10px;color:var(--dim);width:58px;text-align:right;line-height:1.15}
#bReroll{width:50px;height:40px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:9.5px;font-weight:800;line-height:1.15;padding:0}
#bReroll .bi{font-size:15px;display:block}
#bReroll.free{border-color:#ffe27a;box-shadow:0 0 8px #ffe27a55}
#bReroll.paid{border-color:#ff8fa3}
#bReroll.mode{background:#2d2a45;border-color:#fff}
#bReroll.armed{background:#b3121f;border-color:#ff3b3b;color:#fff;animation:thrP2 .6s infinite}
@keyframes thrP2{0%,100%{box-shadow:0 0 4px #ff3b3b}50%{box-shadow:0 0 16px #ff3b3b}}
#bReroll:disabled{opacity:.35}
.die.rsel{transform:translateY(-6px) rotate(-8deg);outline:2px solid #fff;outline-offset:1px}
.die.rsel::before{content:'↻';position:absolute;top:-8px;left:-6px;font-size:11px;font-weight:900;background:#fff;color:#000;border-radius:6px;padding:0 3px;line-height:13px}
.die.fresh{box-shadow:0 0 0 2px #fff,0 0 14px var(--dc)}
.die.fresh::after{content:'NEW';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);font-size:7.5px;font-weight:900;background:#fff;color:#000;border-radius:4px;padding:0 2px;line-height:10px}
.die.drop{animation:dropB .55s infinite;outline:2px dashed #ff3b3b;outline-offset:1px}
.die.drop::before{content:'✕';position:absolute;top:-8px;left:-6px;font-size:10px;font-weight:900;background:#ff3b3b;color:#fff;border-radius:6px;padding:0 3px;line-height:13px}
@keyframes dropB{0%,100%{opacity:1}50%{opacity:.25}}
#dice .die{cursor:pointer}

/* skills */
#skills{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:5px}
.sk{position:relative;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:6px 6px 5px;text-align:left;min-height:72px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;font:inherit}
.sk .t{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between}
.sk .n{font-size:11.5px;font-weight:800;margin:2px 0 2px;line-height:1.1}
.sk{padding:5px 5px 4px!important}
.sk.sup .t span:first-child{color:#7dffb0}
.sk .c{font-size:12px;letter-spacing:-1px}
.sk .d{font-size:9.5px;color:var(--dim);margin-top:1px;line-height:1.15}
.sk.no{opacity:.35}
.sk.sel{border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 14px #fff6;transform:translateY(-3px)}
.sk.sel::after{content:'ещё тап ✓';position:absolute;right:5px;top:-9px;font-size:9px;font-weight:800;color:#000;background:#fff;border-radius:6px;padding:1px 5px}
.sk>*{position:relative;z-index:1}
.sk .ef{position:absolute;left:0;top:0;bottom:0;z-index:0;border-radius:11px 0 0 11px;background:color-mix(in srgb,var(--ec) 26%,transparent);transition:width .35s}
.sk.ult.ready .ef{border-radius:11px;background:linear-gradient(90deg,color-mix(in srgb,var(--ec) 50%,transparent),color-mix(in srgb,var(--ec) 30%,transparent))}
.sk.ult.ready .t span:first-child{color:#fff;font-weight:900}
.sk.ult.ready{border-color:var(--ec);animation:glowU 1.2s infinite}
@keyframes glowU{0%,100%{box-shadow:0 0 6px var(--ec)}50%{box-shadow:0 0 18px var(--ec)}}
.sk.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#actRow{flex:none;display:flex;gap:6px;margin-top:8px;height:36px}
#actRow button{border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-size:12px}
#hint{flex:1;color:var(--text);font-size:11px;line-height:1.2;display:flex;align-items:center}
#bClear{width:64px}
#bGo{width:112px;font-weight:900!important;font-size:14px!important;color:#fff!important;border:none!important;background:linear-gradient(90deg,#ff7a2f,#c77dff)!important}
#bGo:disabled{opacity:.35}

/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
#nums{position:absolute;inset:0;pointer-events:none;z-index:21}
.dn{position:absolute;font-weight:900;font-size:19px;text-shadow:0 2px 0 #000,0 0 6px #000;animation:dn 1s forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.dn.big{font-size:26px}
@keyframes dn{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.25)}30%{transform:translate(-50%,-70%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%)}}
.toast{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:14px;padding:4px 10px;border-radius:10px;background:#000c;border:1px solid var(--ec);color:#fff;white-space:nowrap;animation:toast 1s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1;transform:translate(-50%,-50%)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}
#banner{position:absolute;left:0;right:0;top:15%;z-index:22;pointer-events:none;display:flex;flex-direction:column;align-items:center;opacity:0}
#banner.show{animation:ban 1.2s forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.8)}12%{opacity:1;transform:scale(.95)}20%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#banner .bt{font-size:29px;font-weight:900;letter-spacing:1px;padding:4px 18px;background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 10px #0008)}
#banner .bi{font-size:21px}
#banner .bd{font-size:12px;color:#fff;background:#000b;padding:3px 10px;border-radius:8px;margin-top:2px;max-width:90%;text-align:center}
#chainLbl{position:absolute;right:10px;top:40px;z-index:22;font-weight:900;font-size:22px;color:#ffe27a;text-shadow:0 2px 0 #000,0 0 12px #ff7a2f;opacity:0;pointer-events:none}
#chainLbl.show{animation:chainA 1.4s forwards}
@keyframes chainA{0%{opacity:0;transform:scale(2) rotate(-8deg)}15%{opacity:1;transform:scale(1) rotate(-4deg)}80%{opacity:1}100%{opacity:0}}
#veil{position:absolute;inset:0;z-index:19;pointer-events:none;background:#000;opacity:0;transition:opacity .25s}
#flash{position:absolute;inset:0;z-index:23;pointer-events:none;opacity:0}

#ov{position:absolute;inset:0;z-index:40;background:#0a0812ee;display:none;flex-direction:column;padding:16px;overflow:auto}
#ov.on{display:flex}
#ov h2{margin:4px 0 8px;font-size:22px}
#ov h3{margin:12px 0 5px;font-size:14px;color:var(--omni)}
#ov li{font-size:13px;line-height:1.4;color:#ddd}
#ov ul{padding-left:18px;margin:3px 0}
#ov .rt{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12.5px;align-items:center}
#ov .rt .k{font-size:15px;white-space:nowrap}
#ov .bigbtn{margin-top:16px;padding:13px;border-radius:12px;border:none;background:linear-gradient(90deg,var(--fire),var(--bolt));color:#fff;font-weight:800;font-size:16px;font-family:inherit;flex:none}
#ov .close{align-self:flex-end;flex:none}
#ov ul.intro{padding-left:0;list-style:none}
#ov ul.intro li{font-size:14px;line-height:1.45;margin-bottom:10px;color:#ddd}
#ov .bigbtn.alt{background:var(--panel2);border:1px solid #ffe27a;color:#ffe27a}
#ov .bigbtn.alt+.bigbtn{margin-top:8px}
.rxNote{font-size:12.5px;color:var(--dim);line-height:1.4;margin-bottom:8px}
.rxCircle{font-size:15px;text-align:center;padding:8px;border-radius:10px;background:var(--panel);margin-bottom:6px}
.rxCircle span{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.rxG{margin-top:10px;border-left:3px solid var(--ec);padding-left:8px}
.rxH{font-size:13px;font-weight:800;color:var(--ec);margin-bottom:4px}
.rxRow{display:flex;gap:8px;font-size:12.5px;line-height:1.35;padding:3px 0;color:#ddd}
.rxRow .k{white-space:nowrap;font-size:14px}
.rxRow.off{opacity:.4}
#ov.pick{padding:12px 10px}
.pkHint{font-size:12px;color:var(--dim);margin-bottom:10px}
.pkGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.pk{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 7px 7px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s}
.pk.on{border-color:var(--ec);box-shadow:0 0 0 1px var(--ec),0 0 14px -2px var(--ec);transform:translateY(-2px)}
.pkArt{height:84px;margin-top:-22px;background:center bottom/contain no-repeat;filter:drop-shadow(0 4px 4px #0009)}
.pk:not(.on) .pkArt{filter:grayscale(.5) brightness(.8)}
.pkN{font-weight:800;font-size:14px;margin-top:2px;display:flex;justify-content:space-between;align-items:center}
.pkN span{font-size:10px;color:var(--dim);font-weight:600}
.pkR{font-size:11.5px;color:#d8d2ea;margin:4px 0 2px;line-height:1.35}
.pk.on .pkN{color:var(--ec)}
.pk ul{list-style:none;padding:0!important;margin:0!important}
.pk li{font-size:10px!important;line-height:1.25!important;color:#d8d2ea!important;margin-bottom:2px}
.pk li i{font-style:normal;color:var(--dim);font-size:8.5px;text-transform:uppercase;display:block}
.pkB{position:absolute;top:-8px;right:6px;z-index:2;font-size:10px;font-weight:900;padding:1px 7px;border-radius:8px;color:#000}
.pkB.f{background:var(--ec)}.pkB.b{background:#cfc8e8}
.pkDice{text-align:center;font-size:13px;margin-top:10px;color:var(--dim)}
#ov .bigbtn:disabled{opacity:.4}
.endT{font-size:34px;font-weight:900;text-align:center;margin-top:16px}
.stat{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #fff1}
/* невысокий экран (Safari с панелями): враги и босс меньше, чтобы не залезать под верхнюю панель */
@media (max-height:760px){.en .art{max-height:13vh}.en.boss .art{max-height:17vh}}
@media (max-height:640px){.en .art{max-height:11.5vh}.en.boss .art{max-height:14vh}}
:root{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
</style>
</head>
<body>
<div id="app"><div id="motes"></div><div id="bossFx"><div class="rays"></div><div class="vig"></div></div>
  <div id="stage">
    <div id="top">
      <div id="waveLbl">Волна 1/3</div><div id="roundLbl">Раунд 1</div>
      <div id="phaseLbl">план</div>
      <div class="sp"></div>
      <button class="ib" id="bSound">🔊</button>
      <button class="ib" id="bRx">✨</button>
      <button class="ib" id="bHelp">📖</button>
      <button class="ib" id="bNew">↻</button>
    </div>
    <div id="enemies"></div>
    <div id="board"></div>
    <div id="mid"></div>
    <div id="allies"></div>
    <div id="diceRow"><button id="bReroll"></button><div id="dice"></div><div id="diceInfo"></div></div>
    <div id="skills"></div>
    <div id="actRow"><div id="hint"></div><button id="bClear">Сброс</button><button id="bGo">▶ В бой</button></div>
  </div>
  <div id="veil"></div>
  <canvas id="fx"></canvas>
  <div id="nums"></div>
  <div id="chainLbl"></div>
  <div id="banner"><div class="bi"></div><div class="bt"></div><div class="bd"></div></div>
  <div id="flash"></div>
  <div id="edge"></div>
  <div id="stageFx"><b></b></div>
  <div id="ov"></div>

<script>
// Ядро боя Tales of Elements (прототип v4): 3 волны (простая, обычная, босс), стихии врагов, поддержка, статусы на героях.
// Раунд из 3 этапов; время в десятых долях этапа: 10 = 1 этап, раунд = 30.
// Игрок в начале раунда ставит действия героев на шкалу; simulate() проигрывает раунд.
// Та же функция даёт точный предпросмотр (на копии состояния) и настоящий ход (на состоянии).
// Одноразовый прототип: значения зашиты здесь.
var CORE = (function () {
  var CFG = {
    ROUND: 30,         // 3 этапа
    DICE: 6,
    OMNI: 0.10,
    ENERGY_MAX: 3,
    CHAIN_STEP: 0.25,  // каждая следующая реакция в раунде: бонус ×(1 + 0.25·(n−1))
    LOOK: 15,          // сколько следующего раунда видно на шкале
    STRONG: 1.5,       // стихия бьёт слабую
    WEAK: 0.75,        // стихия бьёт сильную
    WAVES: 3,
    BONUS_DICE_MAX: 2   // наград-кубиков на следующий раунд, не больше
  };
  // Сложность: урон и HP врагов, сила лечения и щитов героев
  var DIFF = {
    easy:   { n: 'Лёгкая',  dmg: 1,    hp: 1,    heal: 1 },
    normal: { n: 'Средняя', dmg: 1.15, hp: 1.05, heal: 0.9 },
    hard:   { n: 'Сложная', dmg: 1.3,  hp: 1.15, heal: 0.8 }
  };
  function dm(S) { return DIFF[S.diff || 'easy'].dmg; }
  function hm(S, v) { return Math.round(v * DIFF[S.diff || 'easy'].heal); }

  function planTimes(S, plan) {

  // Оплата всего плана по порядку. Свои кубики → пары кубиков стихии вне поля → ✦ → пары с кубиками напарника.
  function payAll(S, plan) {
    var free = S.dice.map(function (d, i) { return i; }), pays = [], energy = {};

      if (sk.energy) {
        if (energy[p.hero] < sk.energy) return { ok: false, failAt: j, why: 'energy', pays: pays, energy: energy };

        else if (partner.indexOf(d) >= 0) mate.push(i); else useless.push(i);
      });
      var take = [], need = sk.cost;
      while (need > 0 && own.length) { take.push(own.shift()); need--; }
      while (need > 0 && useless.length >= 2) { take.push(useless.shift(), useless.shift()); need--; }
      while (need > 0 && omni.length) { take.push(omni.shift()); need--; }
      var rest = useless.concat(mate);
      while (need > 0 && rest.length >= 2) { take.push(rest.shift(), rest.shift()); need--; }
      if (need > 0) return { ok: false, failAt: j, why: 'dice', pays: pays, energy: energy };
      pays.push(take);
      free = free.filter(function (i) { return take.indexOf(i) < 0; });
    }
    return { ok: true, pays: pays, free: free, energy: energy };
  }

  function canAdd(S, plan, entry) {
    var h = S.heroes[entry.hero];
    if (!h || h.dead || S.field.indexOf(entry.hero) < 0) return { ok: false, why: 'field' };
    if (timeUsed(plan, entry.hero) + dur(entry.hero, entry.si) > CFG.ROUND) return { ok: false, why: 'time' };
    var r = payAll(S, plan.concat([entry]));

    return { ok: true, pay: r.pays[r.pays.length - 1] };

  // ---------- Симуляция раунда ----------
  function simulate(S0, plan, apply) {
    var S = apply ? S0 : clone(S0);
    var ev = [], sum = { heroActs: [], enemyActs: [], pushes: [], kills: [], reactions: 0, ticks: [], rewards: [], heroReacts: [] };
    var end = tEnd(S);
    var hpBefore = {}; S.enemies.forEach(function (e) { hpBefore[e.id] = e.hp + e.shield; });
    Object.keys(S.heroes).forEach(function (k) { hpBefore[k] = S.heroes[k].hp; });
    var pay = payAll(S, plan);
    var acts = planTimes(S, plan).map(function (a, j) { a.pay = pay.pays[j] || []; return a; });
    acts.sort(function (a, b) { return a.end - b.end || a.i - b.i; });
    var spentIdx = [];
    var k = 0, guard = 0;
    while (!S.over && guard++ < 500) {
      var ha = k < acts.length ? acts[k] : null;
      var ne = null;
      S.enemies.forEach(function (e) { if (!e.dead && e.next <= end + 1e-9 && (!ne || e.next < ne.next - 1e-9)) ne = e; });
      if (!ha && !ne) break;
      if (ha && S.cleared && !HEROES[ha.hero].skills[ha.si].sup) { k++; sum.heroActs.push({ i: ha.i, hero: ha.hero, si: ha.si, reactions: [], kills: [], cancelled: true, skipped: true }); continue; }
      if (ha && (!ne || ha.end <= ne.next + 1e-9)) { k++; heroAct(S, ha, ev, sum, spentIdx); }
      else enemyAct(S, ne, ev, sum);
      checkOver(S, ev);
    }
    // не успевшие действия (волна зачищена или бой окончен)
    for (; k < acts.length; k++) sum.heroActs.push({ i: acts[k].i, hero: acts[k].hero, si: acts[k].si, reactions: [], kills: [], cancelled: true, skipped: true });
    if (!S.over) endTicks(S, ev, sum);
    if (S.cleared && !S.over) ev.push({ type: 'waveClear', n: S.wave + 1 });
    if (apply) S.dice = S.dice.filter(function (d, i) { return spentIdx.indexOf(i) < 0; });
    sum.next = S.enemies.map(function (e) { return { id: e.id, next: e.next, dead: e.dead, a: action(e), stun: e.stun }; });
    sum.after = {};
    S.enemies.forEach(function (e) { sum.after[e.id] = { hp: e.hp, shield: e.shield, aura: e.aura, dead: e.dead }; });
    Object.keys(S.heroes).forEach(function (k2) { var h = S.heroes[k2]; sum.after[k2] = { hp: h.hp, dead: h.dead, energy: h.energy, mark: h.mark }; });
    sum.dmgDealt = 0; S.enemies.forEach(function (e) { sum.dmgDealt += hpBefore[e.id] - e.hp - e.shield; });
    sum.dmgTaken = 0; Object.keys(S.heroes).forEach(function (k3) { sum.dmgTaken += hpBefore[k3] - S.heroes[k3].hp; });
    sum.over = S.over; sum.cleared = S.cleared; sum.field = S.field.slice(); sum.chain = S.chain;
    sum.heroSt = {}; Object.keys(S.heroes).forEach(function (k4) { sum.heroSt[k4] = JSON.parse(JSON.stringify(S.heroes[k4].st)); });
    return { ev: ev, sum: sum, S: S };
  }

  // Конец раунда: яд и ожог, реген, щиты истекают
  function endTicks(S, ev, sum) {
    var time = tEnd(S);
    Object.keys(S.heroes).forEach(function (k) {
      var h = S.heroes[k]; if (h.dead) return;
      ['burn', 'poison'].forEach(function (sk) {
        var s = h.st[sk]; if (!s || h.dead) return;
        h.hp = Math.max(0, h.hp - s.v); S.stats.taken += s.v;
        sum.ticks.push({ hero: k, k: sk, v: -s.v });
        ev.push({ type: 'heroTick', hero: k, k: sk, v: -s.v, hp: h.hp, time: time });
        if (--s.n <= 0) { delete h.st[sk]; ev.push({ type: 'heroStatusOff', hero: k, k: sk }); }
        if (h.hp <= 0) heroDown(S, h, ev);
      });
      if (h.dead) return;
      var r = h.st.regen;
      if (r) {
        var v = Math.min(r.v, h.max - h.hp); h.hp += v; S.stats.healed += v;
        sum.ticks.push({ hero: k, k: 'regen', v: v });
        ev.push({ type: 'heroTick', hero: k, k: 'regen', v: v, hp: h.hp, time: time });
        if (--r.n <= 0) { delete h.st.regen; ev.push({ type: 'heroStatusOff', hero: k, k: 'regen' }); }
      }
      if (h.mark && h.mark.until <= S.round) { h.mark = null; ev.push({ type: 'heroMarkOff', hero: k }); }
      ['shield', 'stun', 'weak'].forEach(function (sk2) {
        if (h.st[sk2] && h.st[sk2].until <= S.round) { delete h.st[sk2]; ev.push({ type: 'heroStatusOff', hero: k, k: sk2, expired: true }); }
      });
    });
    checkOver(S, ev);
  }

  // Награды за мастерство: сорвал тяжёлый удар → +1 энергии героям на поле;
  // цепь ×3 → +1 кубик в следующем раунде; добил реакцией → +1 кубик (до 2 наград-кубиков за раунд).
  function reward(S, ev, sum, kind, src) {
    var txt;
    if (kind === 'break') {
      fieldHeroes(S).forEach(function (t) { t.energy = Math.min(CFG.ENERGY_MAX, t.energy + 1); ev.push({ type: 'energy', hero: t.id, v: t.energy }); });
      txt = '+1 энергии героям на поле';
    } else {
      if (kind === 'chain') { if (S.rw.chain) return; S.rw.chain = true; }
      if (S.bonusDice >= CFG.BONUS_DICE_MAX) return;
      S.bonusDice++;
      txt = '+1 кубик в следующем раунде';
    }
    S.stats.rewards++;
    var why = { break: 'тяжёлый удар сорван', chain: 'цепь ×3', kill: 'добит реакцией' }[kind];
    sum.rewards.push({ kind: kind, txt: txt, why: why });
    ev.push({ type: 'reward', kind: kind, txt: txt, why: why, src: src });
  }

  function fieldHeroes(S) { return S.field.filter(function (k) { return k && !S.heroes[k].dead; }).map(function (k) { return S.heroes[k]; }); }

  function heroAct(S, a, ev, sum, spentIdx) {
    var h = S.heroes[a.hero], sk = HEROES[a.hero].skills[a.si];
    var rec = { i: a.i, hero: a.hero, si: a.si, time: a.end, start: a.start, reactions: [], kills: [], cancelled: false, ghost: a.ghost, k: 1 };
    sum.heroActs.push(rec);
    if (h.dead || S.field.indexOf(a.hero) < 0 || (sk.energy && h.energy < sk.energy)) {
      rec.cancelled = true; ev.push({ type: 'heroCancel', hero: a.hero, time: a.end, i: a.i }); return;
    }
    if (h.st.stun) {
      delete h.st.stun; rec.cancelled = true; rec.stunned = true;
      ev.push({ type: 'heroCancel', hero: a.hero, time: a.end, i: a.i, stun: true });
      ev.push({ type: 'heroStatusOff', hero: a.hero, k: 'stun' });
      return;
    }
    if (sk.sup) {
      a.pay.forEach(function (i) { spentIdx.push(i); });
      ev.push({ type: 'cast', hero: a.hero, si: a.si, name: sk.name, el: h.el, time: a.end, i: a.i, targets: [], sup: sk.sup, plan: a.pay.slice() });
      h.energy = Math.min(CFG.ENERGY_MAX, h.energy + 1);
      ev.push({ type: 'energy', hero: a.hero, v: h.energy });
      support(S, h, sk, ev, rec);
      S.stats.actions++; S.stats.supports++;
      return;
    }
    var targets;
    if (sk.tgt === 'all') targets = liveEnemies(S);
    else {
      var t = unit(S, a.target);
      if (!t || t.dead) t = liveEnemies(S)[0];
      targets = t ? [t] : [];
    }
    if (!targets.length) { rec.cancelled = true; return; }
    rec.targets = targets.map(function (x) { return x.id; });
    a.pay.forEach(function (i) { spentIdx.push(i); });
    if (h.st.weak) { rec.k = 0.5; delete h.st.weak; rec.weak = true; }
    ev.push({ type: 'cast', hero: a.hero, si: a.si, name: sk.name, el: h.el, time: a.end, i: a.i,
      targets: rec.targets, ult: !!sk.energy, strong: a.si === 1, plan: a.pay.slice(), weak: !!rec.weak });
    if (rec.weak) ev.push({ type: 'heroStatusOff', hero: a.hero, k: 'weak' });
    if (sk.energy) h.energy = 0; else h.energy = Math.min(CFG.ENERGY_MAX, h.energy + 1);
    ev.push({ type: 'energy', hero: a.hero, v: h.energy });
    var reacted = {};
    targets.forEach(function (e) { strike(S, e, sk.dmg, h.el, ev, reacted, 'skill', rec, sum); });
    // лечение ульты — всему отряду, включая запасного
    if (sk.heal) Object.keys(S.heroes).map(function (k) { return S.heroes[k]; }).filter(function (t) { return !t.dead; }).forEach(function (t) {
      var v = Math.min(hm(S, sk.heal), t.max - t.hp); t.hp += v; S.stats.healed += v;
      ev.push({ type: 'heroHeal', hero: t.id, v: v, hp: t.hp, from: h.id, cleaned: [] });
    });
    S.stats.actions++;
  }

  function support(S, h, sk, ev, rec) {
    var team = fieldHeroes(S);
    if (sk.sup === 'heal') {
      var t = team.slice().sort(function (x, y) { return (x.hp - x.max) - (y.hp - y.max) || (Object.keys(y.st).length - Object.keys(x.st).length); })[0];
      if (!t) return;
      var v = Math.min(hm(S, sk.v), t.max - t.hp); t.hp += v; S.stats.healed += v;
      var cleaned = ['burn', 'poison', 'stun', 'weak'].filter(function (k) { return t.st[k]; });
      cleaned.forEach(function (k) { delete t.st[k]; });
      if (t.mark) { cleaned.push('mark'); t.mark = null; }
      rec.heal = { hero: t.id, v: v };
      ev.push({ type: 'heroHeal', hero: t.id, v: v, hp: t.hp, from: h.id, cleaned: cleaned });
    } else if (sk.sup === 'shield') {
      team.forEach(function (t) {
        var cur = t.st.shield ? t.st.shield.v : 0;
        t.st.shield = { v: Math.max(cur, hm(S, sk.v)), until: S.round + 1 };
        S.stats.shielded += hm(S, sk.v);
        ev.push({ type: 'heroShield', hero: t.id, v: t.st.shield.v, from: h.id });
      });
    } else if (sk.sup === 'teamheal') {
      team.forEach(function (t) {
        var v2 = Math.min(hm(S, sk.v), t.max - t.hp); t.hp += v2; S.stats.healed += v2;
        ev.push({ type: 'heroHeal', hero: t.id, v: v2, hp: t.hp, from: h.id, cleaned: [] });
      });
    } else if (sk.sup === 'regen') {
      team.forEach(function (t) {
        t.st.regen = { v: hm(S, sk.v), n: sk.n };
        ev.push({ type: 'heroRegen', hero: t.id, v: t.st.regen.v, n: sk.n, from: h.id });
      });
    }
  }

  function strike(S, e, dmg, el, ev, reacted, tag, rec, sum) {
    if (e.dead) return;
    var p = reactionPreview(e, el);
    if (p && p.kind === 'react' && !reacted[e.id]) {
      reacted[e.id] = true;
      var r = REACT[p.key];
      S.chain++; sum.reactions++;
      if (S.chain >= 3) reward(S, ev, sum, 'chain', e.id);
      S.stats.maxChain = Math.max(S.stats.maxChain, S.chain);
      var m = 1 + CFG.CHAIN_STEP * (S.chain - 1);
      S.stats.reactions[p.key] = (S.stats.reactions[p.key] || 0) + 1;
      e.aura = null;
      rec.reactions.push({ key: p.key, target: e.id, chain: S.chain });
      ev.push({ type: 'react', target: e.id, key: p.key, name: r.name, first: p.key.split('>')[0], second: el, chain: S.chain, mult: m });
      if (r.breakShield && e.shield > 0) { ev.push({ type: 'shieldBreak', target: e.id, v: e.shield }); e.shield = 0; }
      deal(S, e, dmg, ev, tag, el, rec, sum);
      deal(S, e, Math.round(dmg * r.bonus * m), ev, 'react', el, rec, sum);
      if (r.push) push(S, e, r.push, ev, sum);
      if (r.stun && !e.dead) { e.stun = true; S.stats.stuns++; ev.push({ type: 'stun', target: e.id }); }
      if (r.weak && !e.dead) { e.weak = true; ev.push({ type: 'weak', target: e.id }); }
      if (r.teamHeal) fieldHeroes(S).forEach(function (t) {
        var v = Math.min(hm(S, dmg * r.teamHeal * m), t.max - t.hp); t.hp += v; S.stats.healed += v;
        ev.push({ type: 'heroHeal', hero: t.id, v: v, hp: t.hp, from: null, cleaned: [] });
      });
      if (r.teamShield) fieldHeroes(S).forEach(function (t) {
        var v = hm(S, dmg * r.teamShield * m), cur = t.st.shield ? t.st.shield.v : 0;
        t.st.shield = { v: Math.max(cur, v), until: S.round + 1 }; S.stats.shielded += v;
        ev.push({ type: 'heroShield', hero: t.id, v: t.st.shield.v, from: null });
      });
      var others = liveEnemies(S).filter(function (o) { return o !== e; });
      if (r.splash) others.forEach(function (o) {
        ev.push({ type: 'splash', from: e.id, to: o.id });
        deal(S, o, Math.round(dmg * r.splash * m), ev, 'splash', 'fire', rec, sum);
      });
      if (r.chain) others.forEach(function (o) {
        ev.push({ type: 'chain', from: e.id, to: o.id });
        strike(S, o, Math.round(dmg * r.chain * m), 'bolt', ev, reacted, 'chain', rec, sum);
      });
      ev.push({ type: 'aura', target: e.id, el: null });
      return;
    }
    deal(S, e, dmg, ev, tag, el, rec, sum);
    if (!e.dead && el) { e.aura = el; ev.push({ type: 'aura', target: e.id, el: el }); }
  }

  // Урон по врагу: множитель круга стихий (стихия удара → стихия врага), слабость героя, щит.
  function deal(S, e, dmg, ev, tag, el, rec, sum) {
    if (e.dead || dmg <= 0) return;
    var em = mult(el, e.el);
    dmg = Math.round(dmg * em * (rec.k || 1));
    var abs = Math.min(e.shield, dmg);
    e.shield -= abs;
    e.hp = Math.max(0, e.hp - (dmg - abs));
    S.stats.dmg += dmg;
    if (tag !== 'skill') S.stats.reactDmg += dmg;
    ev.push({ type: 'hit', target: e.id, dmg: dmg, absorbed: abs, hp: e.hp, shield: e.shield, tag: tag, el: el || null, em: em });
    if (e.hp <= 0) {
      e.dead = true; e.aura = null; e.shield = 0;
      rec.kills.push(e.id); sum.kills.push(e.id);
      ev.push({ type: 'death', target: e.id });
      if (tag !== 'skill') reward(S, ev, sum, 'kill', e.id);
    }
  }

  function push(S, e, amount, ev, sum) {
    if (e.dead) return;
    var from = e.next;
    e.next += amount;
    S.stats.pushes++;
    var out = from <= tEnd(S) + 1e-9 && e.next > tEnd(S) + 1e-9;
    if (out) S.stats.dodged++;
    sum.pushes.push({ id: e.id, from: from, to: e.next, a: action(e), out: out });
    ev.push({ type: 'push', target: e.id, amount: amount, from: from, to: e.next, out: out, a: action(e) });
    if (out && action(e).big) reward(S, ev, sum, 'break', e.id);
  }

  function pickTargets(S, e, tg) {
    var alive = function (s) { var k = S.field[s]; return k && !S.heroes[k].dead ? k : null; };
    var out = [];
    if (tg === 'all') [0, 1].forEach(function (s) { var k = alive(s); if (k) out.push(k); });
    else if (tg === 'weak') {
      var c = [0, 1].map(alive).filter(Boolean);
      if (c.length) out.push(c.reduce(function (x, y) { return S.heroes[x].hp <= S.heroes[y].hp ? x : y; }));
    } else {
      var s0 = e.alt % 2; e.alt++;
      var k1 = alive(s0) || alive(1 - s0); if (k1) out.push(k1);
    }
    return out;
  }

  function addStatus(S, h, st, ev, src) {
    if (h.dead) return;
    if (st.k === 'burn' || st.k === 'poison') {
      var cur = h.st[st.k];
      h.st[st.k] = { v: Math.max(cur ? cur.v : 0, Math.round(st.v * dm(S))), n: Math.max(cur ? cur.n : 0, st.n) };
    } else h.st[st.k] = { until: S.round + 1 };   // оглушение/слабость: до срабатывания или до конца следующего раунда
    S.stats.statuses++;
    ev.push({ type: 'heroStatus', hero: h.id, k: st.k, st: h.st[st.k], from: src });
  }

  function enemyAct(S, e, ev, sum) {
    var a = action(e), time = e.next;
    e.step++; e.next += e.every;
    var rec = { id: e.id, time: time, a: a, cancelled: false, targets: [], dmg: 0 };
    sum.enemyActs.push(rec);
    if (e.stun) {
      e.stun = false; rec.cancelled = true;
      ev.push({ type: 'enemyCancel', enemy: e.id, time: time, a: a });
      if (a.big) reward(S, ev, sum, 'break', e.id);
      return;
    }
    if (a.k === 'atk') {
      var targets = pickTargets(S, e, a.tg);
      var full = Math.round(a.dmg * dm(S)), base = e.weak ? Math.round(full / 2) : full;
      var wasWeak = e.weak; e.weak = false;
      rec.targets = targets.slice(); rec.weak = wasWeak;
      var per = targets.map(function (k) { return Math.round(base * mult(e.el, S.heroes[k].el)); });
      rec.dmg = per.length ? Math.max.apply(null, per) : base;
      ev.push({ type: 'enemyAtk', enemy: e.id, time: time, a: a, targets: targets.slice(), dmg: base, weak: wasWeak });
      targets.forEach(function (k, j) {
        var h = S.heroes[k], dmg = per[j], em = mult(e.el, h.el), abs = 0;
        // Стихийная метка: удар врага вешает его стихию на героя; удар другой стихией по метке — реакция против отряда
        var hr = null;
        if (h.mark && h.mark.el !== e.el && REACT[h.mark.el + '>' + e.el]) {
          var key = h.mark.el + '>' + e.el, rr = REACT[key];
          hr = { key: key, r: rr, extra: Math.round(dmg * rr.bonus) };
          h.mark = null; S.stats.heroReacts++;
          sum.heroReacts.push({ hero: k, key: key, extra: hr.extra, enemy: e.id });
          ev.push({ type: 'heroReact', hero: k, key: key, name: rr.name, first: key.split('>')[0], second: e.el, extra: hr.extra, enemy: e.id });
          if (rr.breakShield && h.st.shield) { delete h.st.shield; ev.push({ type: 'heroStatusOff', hero: k, k: 'shield' }); }
          dmg += hr.extra;
        }
        if (h.st.shield) {
          abs = Math.min(h.st.shield.v, dmg); h.st.shield.v -= abs;
          if (h.st.shield.v <= 0) delete h.st.shield;
        }
        h.hp = Math.max(0, h.hp - (dmg - abs)); S.stats.taken += dmg - abs;
        ev.push({ type: 'heroHit', hero: k, dmg: dmg, absorbed: abs, hp: h.hp, em: em, shield: h.st.shield ? h.st.shield.v : 0 });
        if (h.hp <= 0) { heroDown(S, h, ev); return; }
        if (a.st) addStatus(S, h, a.st, ev, e.id);
        if (hr) {
          var r2 = hr.r;
          if (r2.stun) addStatus(S, h, { k: 'stun' }, ev, e.id);
          if (r2.weak) addStatus(S, h, { k: 'weak' }, ev, e.id);
          if (r2.push && h.energy > 0) { h.energy--; ev.push({ type: 'energy', hero: k, v: h.energy, lost: true }); }
          if (r2.splash || r2.chain) fieldHeroes(S).forEach(function (o) {
            if (o === h) return;
            var sd = Math.round(dmg * (r2.splash || r2.chain) * 0.5);
            o.hp = Math.max(0, o.hp - sd); S.stats.taken += sd;
            ev.push({ type: 'heroHit', hero: o.id, dmg: sd, absorbed: 0, hp: o.hp, em: 1, shield: o.st.shield ? o.st.shield.v : 0, splash: true });
            if (o.hp <= 0) heroDown(S, o, ev);
          });
        } else {
          h.mark = { el: e.el, until: S.round + 1 };
          ev.push({ type: 'heroMark', hero: k, el: e.el });
        }
      });
    } else if (a.k === 'debuff') {
      var tg2 = pickTargets(S, e, a.tg);
      rec.targets = tg2.slice();
      ev.push({ type: 'enemyDebuff', enemy: e.id, time: time, a: a, targets: tg2.slice() });
      tg2.forEach(function (k) { addStatus(S, S.heroes[k], a.st, ev, e.id); });
    } else if (a.k === 'shield') {
      e.shield = a.v;
      ev.push({ type: 'enemyShield', enemy: e.id, time: time, a: a, v: a.v });
    } else if (a.k === 'curse') {
      S.curse++;
      ev.push({ type: 'enemyCurse', enemy: e.id, time: time, a: a });
    } else {
      ev.push({ type: 'enemyIdle', enemy: e.id, time: time, a: a });
    }
  }

  function heroDown(S, h, ev) {
    h.dead = true; h.st = {}; h.mark = null;
    ev.push({ type: 'heroDeath', hero: h.id });
    var slot = S.field.indexOf(h.id);
    if (slot < 0) return;
    if (S.bench && !S.heroes[S.bench].dead) {
      var inc = S.bench;
      S.field[slot] = inc; S.bench = h.id;
      ev.push({ type: 'autoSwap', slot: slot, inHero: inc, outHero: h.id });
    }
  }

  function checkOver(S, ev) {
    if (S.over || S.cleared) return;
    if (Object.keys(S.heroes).every(function (k) { return S.heroes[k].dead; })) { S.over = 'lose'; ev.push({ type: 'over', win: false }); return; }
    if (!liveEnemies(S).length) {
      if (S.wave >= CFG.WAVES - 1) { S.over = 'win'; S.waveRounds.push(S.round); ev.push({ type: 'over', win: true }); }
      else { S.cleared = true; }
    }
  }

  function reactionPreview(e, el) {
    if (!el || e.dead) return null;
    if (!e.aura) return { kind: 'apply' };
    if (e.aura === el) return { kind: 'same' };
    var key = e.aura + '>' + el;
    if (REACT[key]) return { kind: 'react', key: key, r: REACT[key] };
    return { kind: 'apply' };
  }

  function swap(S, outId) {
    if (S.swapUsed || !S.bench || S.heroes[S.bench].dead) return false;
    var slot = S.field.indexOf(outId); if (slot < 0) return false;
    S.field[slot] = S.bench; S.bench = outId; S.swapUsed = true;
    return true;
  }

  // Бот: жадно добавляет действие, которое лучше всего улучшает исход раунда.
  // Щит, реген и яд/ожог учитываются и на будущее, за пределами раунда.
  function score(r) {
    var s = r.sum, fut = 0;
    Object.keys(s.heroSt).forEach(function (k) {
      if (s.after[k].dead) return;
      var st = s.heroSt[k];
      if (st.shield) fut += 0.7 * st.shield.v;
      if (st.regen) fut += 0.8 * st.regen.v * st.regen.n;
      if (st.burn) fut -= st.burn.v * st.burn.n;
      if (st.poison) fut -= st.poison.v * st.poison.n;
      if (st.stun) fut -= 20;
      if (st.weak) fut -= 12;
      if (s.after[k].mark) fut -= 6;
    });

  if (k === 'regen' || k === 'burn' || k === 'poison') return STI(k) + v.v + '×' + v.n;
  return STI(k);
}
const mfmt = m => m > 1 ? '×1,5' : m < 1 ? '×0,75' : '';
function intentText(a, weak) {
  if (a.k === 'atk') return (a.big ? '💥' : '⚔️') + (weak ? Math.round(a.dmg / 2) : a.dmg) + (a.tg === 'all' ? '×2' : '');
  if (a.k === 'debuff') return STI(a.st.k);
  return { rest: '💤', shield: '🛡' + a.v, curse: '☠', windup: '⏳' }[a.k];
}
function intentLong(a) {
  const st = a.st ? ' + ' + C.HST[a.st.k].n : '';
  if (a.k === 'atk') return (a.big ? '💥 ' : '⚔ ') + a.n + ' ' + a.dmg + (a.tg === 'all' ? ' по обоим' : a.tg === 'weak' ? ' по слабому' : '') + st;
  if (a.k === 'debuff') return STI(a.st.k) + ' ' + a.n + ': ' + C.HST[a.st.k].n + (a.tg === 'all' ? ' обоим' : '');
  return { rest: '💤 Отдых', shield: '🛡 Щит ' + a.v, curse: '☠ Проклятие: −1 кубик', windup: '⏳ Замах' }[a.k];
}

// Намерение врага (таймер до хода) и угроза — сколько его ходов до тяжёлого удара.
function nextBig(e) {
  const sc = C.FOES[e.key].script;
  for (let k = 0; k < sc.length; k++) { const a = C.actionAt(e, k); if (a.big) return { k, a, t: e.next + k * e.every }; }
  return null;
}
function whenTxt(t) {
  const rel = t - C.t0(S);
  if (rel <= CFG.ROUND + 1e-9) return 'этап ' + fmt(rel);
  const r = Math.ceil((t - 1e-9) / CFG.ROUND);
  return 'раунд ' + r;
}
function renderIntent(e, d) {
  const itn = d.querySelector('.itn'), thr = d.querySelector('.thr');
  d.classList.remove('hot'); thr.className = 'thr'; itn.innerHTML = '';
  if (phase !== 'plan' || D.dead[e.id] || e.dead) return;
  const a = C.action(e);
  itn.innerHTML = `⏱ <b>${whenTxt(e.next)}</b>: ${intentText(a)}${a.st ? STI(a.st.k) : ''}${e.stun ? ' 💫сорвётся' : ''}`;
  const nb = nextBig(e); if (!nb) return;
  const sum = preview && preview.sum;
  const cancel = sum && sum.enemyActs.some(x => x.id === e.id && x.a.big && x.cancelled);
  const pushed = sum && sum.pushes.some(x => x.id === e.id && x.a.big && x.out);
  thr.classList.add('on');
  if (cancel || pushed) { thr.classList.add('ok'); thr.textContent = '💥 ' + nb.a.n + (cancel ? ' — сорвёшь ✓' : ' — отбросишь ✓'); return; }
  if (nb.k === 0) { thr.classList.add('hot'); d.classList.add('hot'); thr.textContent = '⚠ ' + nb.a.n + ' ' + nb.a.dmg + (nb.a.tg === 'all' ? '×2' : '') + ' · ' + whenTxt(nb.t); }
  else thr.textContent = '💥 ' + nb.a.n + ' через ' + nb.k + ' ' + (nb.k === 1 ? 'ход' : 'хода');
}
// бар: текущее HP, полосатый кусок — сколько снимет план, синий — щит
function setBar(card, hp, max, after = null, shield = 0) {

  const a = after == null ? hp : after;
  i.style.width = p(a) + '%';
  b.style.left = p(a) + '%'; b.style.width = (p(hp) - p(a)) + '%';
  if (s) { s.style.left = Math.min(100 - p(shield), p(hp)) + '%'; s.style.width = p(shield) + '%'; }
}
function setAura(id, el) {
  const a = enCard(id).querySelector('.aura');

// ---------- Переброс кубиков ----------
// Первый за раунд — бесплатно. Второй — один кубик пропадает (мигает), подтверждение повторным тапом.
let freshDice = null;   // индексы только что переброшенных кубиков — подсветка
let rr = null;   // режим выбора: { sel: Set индексов, armed, drop }
function renderReroll() {
  const b = $('#bReroll'); if (!b || !S) return;
  const left = C.REROLLS - (S.rerolls || 0), plan0 = phase === 'plan' && !busy && !S.over;
  b.className = ''; b.disabled = !plan0 || (!rr && left <= 0);
  if (rr) {
    const n = rr.sel.size;
    b.classList.add(rr.armed ? 'armed' : 'mode');
    b.innerHTML = !n ? '<span class="bi">✕</span>отмена' : rr.armed ? `<span class="bi">↻${n}</span>ещё тап!` : `<span class="bi">↻${n}</span>${S.rerolls ? '−1 кубик' : 'бросить'}`;
  } else if (left <= 0) b.innerHTML = '<span class="bi">🎲</span>нет';
  else if (!S.rerolls) { b.classList.add('free'); b.innerHTML = '<span class="bi">🎲</span>переброс'; }
  else { b.classList.add('paid'); b.innerHTML = '<span class="bi">🎲</span>за кубик'; }
}
function onRerollBtn() {
  SND.unlock();
  if (phase !== 'plan' || busy || S.over) return;
  if (!rr) {
    if (S.rerolls >= C.REROLLS) { SND.nope(); log('Переброс — не больше двух раз за раунд'); return; }
    rr = { sel: new Set(), armed: false, drop: null }; ghost = null; SND.select();
    log(S.rerolls ? '🎲 Второй переброс стоит один кубик. Выбери кубики и нажми ↻' : '🎲 Переброс бесплатный. Тапни кубики, которые перебросить, и нажми ↻');
    renderAll(); return;
  }
  if (!rr.sel.size) { rr = null; SND.remove(); log('Переброс отменён'); renderAll(); return; }
  if (S.rerolls >= 1 && !rr.armed) {
    rr.armed = true; rr.drop = C.dropPick(S, plan, [...rr.sel]); SND.nope();
    log(`⚠ Второй переброс: мигающий кубик ${EL[S.dice[rr.drop]].i} пропадёт. Ещё тап по ↻ — подтвердить`);
    renderDice(); return;
  }
  doReroll();
}
function onDieTap(i) {
  if (!rr || phase !== 'plan' || busy) return;
  if (rr.sel.has(i)) rr.sel.delete(i); else rr.sel.add(i);
  rr.armed = false; rr.drop = null; SND.tick();
  renderDice();
}
async function doReroll() {
  busy = true;
  const sel = [...rr.sel], drop = rr.armed ? rr.drop : null;
  const ds = [...document.querySelectorAll('#dice .die')];
  sel.forEach(i => ds[i] && ds[i].classList.add('spent'));
  if (drop != null && ds[drop]) { ds[drop].classList.remove('drop'); ds[drop].classList.add('burn'); SND.burn(); }
  await sleep(380);
  const r = C.reroll(S, sel, drop);
  rr = null; busy = false;
  if (!r.ok) { renderAll(); return; }
  D.dice = S.dice.slice(); ghost = null; plan = C.validate(S, plan);
  freshDice = new Set(r.fresh); SND.dice(); renderAll();
  setTimeout(() => { freshDice = null; renderDice(); }, 2200);
  log(`🎲 Переброшено ${sel.length}` + (r.paid ? ', один кубик сгорел' : '') + (S.rerolls < C.REROLLS ? ' · ещё один переброс — за кубик' : ''));
}

function renderBoard() {
  const box = $('#board'); box.innerHTML = '';

    sum.enemyActs.forEach(a => items.push({ id: a.id, t: a.time, a: a.a, dmg: a.a.k === 'atk' ? a.dmg : null, weak: a.weak, cls: a.cancelled ? 'cancel' : a.a.big ? 'big' : a.a.k === 'atk' ? '' : 'soft', cancelled: a.cancelled }));
    sum.next.forEach(n => { if (!n.dead && X(n.next) < 100) items.push({ id: n.id, t: n.next, a: n.a, cls: 'next' + (n.a.big ? ' big' : n.a.k === 'atk' ? '' : ' soft'), stun: n.stun }); });
    const groups = {};
    items.forEach(it => { const k = it.t.toFixed(2); (groups[k] = groups[k] || []).push(it); });
    Object.values(groups).forEach(g => g.forEach((it, k) => {
      const u = C.unit(S, it.id);

      m.style.left = X(it.t) + '%'; m.style.marginLeft = ((k - (g.length - 1) / 2) * 24) + 'px';

      m.innerHTML = `<span class="bd">${badge(it.a, it.dmg, it.weak)}${it.cancelled || it.stun ? '💫' : ''}</span>`;

      tr.appendChild(m);
      if (it.cls === 'from') {
        const ar = document.createElement('div'); ar.className = 'arw';

      }
    }));
  }
  // дорожки героев
  D.field.forEach(id => {
    if (!id) return;
    const u = S.heroes[id];
    const ln = document.createElement('div'); ln.className = 'lane' + (u.dead ? ' dead' : '');
    const lb = document.createElement('div'); lb.className = 'lb'; lb.style.backgroundImage = `url(${img(u.img)})`; lb.style.borderColor = EL[u.el].c;
    const t = document.createElement('div'); t.className = 'tr hero'; t.dataset.lane = id; trackBase(t);
    ln.appendChild(lb); ln.appendChild(t); box.appendChild(ln);

$('#bSound').addEventListener('click', e => { e.currentTarget.textContent = SND.toggle() ? '🔊' : '🔇'; });
app.addEventListener('pointerdown', ev => {
  const t = ev.target.closest('button,.pk,.hc,.en,.die,.ch,.sk'); if (!t) return;
  const a = app.getBoundingClientRect(), r = t.getBoundingClientRect(), d = document.createElement('div');
  const sz = Math.max(r.width, r.height) * 1.6;
  d.className = 'rip'; d.style.width = d.style.height = sz + 'px'; d.style.left = (ev.clientX - a.left) + 'px'; d.style.top = (ev.clientY - a.top) + 'px';
  app.appendChild(d); setTimeout(() => d.remove(), 460);
  try { navigator.vibrate && navigator.vibrate(8); } catch (e) {}
  SND.unlock(); SND.tap();
}, { passive: true });
(function motes() { const m = $('#motes'); for (let i = 0; i < 22; i++) { const e = document.createElement('i'); e.style.left = Math.random() * 100 + '%'; e.style.top = (20 + Math.random() * 80) + '%'; e.style.setProperty('--dx', ((Math.random() - .5) * 60) + 'px'); e.style.animationDuration = (6 + Math.random() * 8) + 's'; e.style.animationDelay = (-Math.random() * 12) + 's'; m.appendChild(e); } })();
window.showReactions = showReactions; window.showHelp = showHelp;
window.hideOv = hideOv; window.newBattle = newBattle; window.showPick = showPick;
window.onerror = (m, s, l) => { document.title = 'ERR ' + m + ' @' + l; };
window.addEventListener('unhandledrejection', ev => { document.title = 'ERR ' + (ev.reason && ev.reason.message) + ' ' + (ev.reason && ev.reason.stack || '').split('\n')[1]; });

// ?auto — бот планирует и жмёт «В бой»; ?auto&shot=1 — остановиться на примерке для скриншота
const AUTO = /auto/.test(location.search), SHOT = /shot/.test(location.search);
function autoStep() {
  if (S.over || phase !== 'plan' || busy) return;
  const t = C.autoTurn(S);
  if (t.swapOut) { selHero = t.swapOut; doSwap(); }
  const AT = +((location.search.match(/at=(\d+)/) || [])[1] || 0);
  if (SHOT && S.round >= AT) {
    plan = t.plan.slice(0, Math.max(1, t.plan.length - 1));
    const g = t.plan[t.plan.length - 1]; if (g) { selHero = g.hero; ghost = g; if (g.target) target = g.target; }
    renderAll(); return;
  }
  plan = t.plan; renderAll();
  setTimeout(execute, 200);
}
newBattle(false);
if (/boxhold/.test(location.search)) setTimeout(() => { const u = S.enemies[0]; CUT.pic(u.img).onload = () => CUT.box(u, 'Пожирание'); CUT.box(u, 'Пожирание'); }, 300);
else if (/cuthold/.test(location.search)) setTimeout(() => { CUT.pic('fire').onload = () => CUT.play('fire', 'Извержение'); CUT.play('fire', 'Извержение'); }, 300);
else if (/toptest/.test(location.search)) {   // проверка: кнопки сверху не перекрыты (запускать с &wave=3)
  started = true; firstRound().then(() => {
    const res = [...document.querySelectorAll('#top .ib')].map(b => { const r = b.getBoundingClientRect(); const t = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2); return b.id + ':' + (b.contains(t) ? 'ok' : 'BLOCKED'); });
    document.title = 'TOP ' + res.join(' ');
  });
}
else if (/rxshow/.test(location.search)) { started = true; showReactions('game'); }
else if (/pickshow/.test(location.search)) { started = true; showPick(); }
else if (/stuntest/.test(location.search)) {   // проверка: Вольт оглушён на планировании
  started = true; firstRound().then(() => {
    S.heroes.bolt.st.stun = true; syncD();
    const c = C.canAdd(S, [], { hero: 'bolt', si: 0, target: S.enemies[0].id });
    if (c.ok) plan = [{ hero: 'bolt', si: 0, target: S.enemies[0].id }];
    selHero = 'bolt'; renderAll();
  });
}
else if (/rrtest/.test(location.search)) {   // проверка переброса: бесплатный, затем платный до «ещё тап»
  started = true; firstRound().then(async () => {
    const n0 = S.dice.length;
    onRerollBtn(); onDieTap(0); onDieTap(1); onRerollBtn(); await sleep(1500);
    const n1 = S.dice.length;
    onRerollBtn(); onDieTap(2); onRerollBtn();
    document.title = 'RR ' + n0 + '>' + n1 + ' rerolls=' + S.rerolls + ' drop=' + (rr && rr.drop);
    if (/go/.test(location.search)) { onRerollBtn(); await sleep(1500); document.title += ' after=' + S.dice.length + ' rerolls=' + S.rerolls; }
  });
}
else if (AUTO) { started = true; firstRound(); } else showHelp();
let games = 0;
(function watch() {
  if (S && S.over && $('#ov').classList.contains('on')) {
    document.title = 'DONE' + (games ? games + 1 : '') + ' ' + S.over + ' r' + S.round;
    if (/again/.test(location.search) && !games) { games++; $('#ov .bigbtn').click(); }
  }
  setTimeout(watch, 500);
})();
</script>
</body>
</html>
